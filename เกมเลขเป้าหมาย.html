<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมเลขเป้าหมาย</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0221;--panel:#170a30;--pink:#ff2e63;--cyan:#08f7fe;--yellow:#f9c80e;--text:#f1eaff;--dim:#9b8bc4;--line:#3a2a5c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(circle at 20% 10%,#2a1456,transparent 45%),var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}
.wrap{width:100%;max-width:520px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 24px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:10px}
.title{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:21px;color:var(--cyan)}
.pill{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:13px;background:#0d0526;border:1px solid var(--line);padding:5px 12px;border-radius:999px;color:var(--yellow)}
.sub{color:var(--dim);font-size:13px;margin-bottom:20px;line-height:1.5}.sub b{color:var(--text)}
.target{display:flex;justify-content:center;margin-bottom:18px}
.target div{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:34px;background:#0d0526;border:2px solid var(--pink);border-radius:14px;padding:8px 26px;color:var(--pink);text-shadow:0 0 14px #ff2e6388}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px;min-height:60px}
.tile{position:relative;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:19px;background:#0d0526;border:2px solid var(--line);color:var(--text);border-radius:12px;padding:12px 16px;cursor:pointer;min-width:56px}
.tile:hover{border-color:var(--cyan)}
.tile.sel{border-color:var(--yellow);background:#241437;box-shadow:0 0 14px #f9c80e55}
.tile .o{position:absolute;top:-9px;right:-9px;width:18px;height:18px;border-radius:50%;background:var(--yellow);color:#241300;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.lbl{font-size:11px;color:var(--dim);margin-bottom:6px}
.grp{margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.op{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:17px;background:#0d0526;border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:10px 16px;cursor:pointer}
.op:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.op:disabled{opacity:.3;cursor:not-allowed}
.msg{min-height:20px;font-size:13px;font-weight:600;margin-bottom:10px}
.msg.err{color:var(--pink)}.msg.win{color:var(--cyan)}
.history{background:#0d0526;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--dim);max-height:80px;overflow-y:auto;margin-bottom:16px;font-family:'Chakra Petch',sans-serif;min-height:38px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;padding:11px 16px;flex:1;background:#0d0526;color:var(--text)}
.btn-check{background:var(--cyan);color:#021a1c;border:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<header><div class="title">🎯 เกมเลขเป้าหมาย</div><div class="pill" id="stagePill">ด่านที่ 1</div></header>
<p class="sub">แตะเลือกตัวเลข <b>1 ตัว</b> เพื่อใช้ √ หรือ ! หรือเลือก <b>2 ตัว</b> ตามลำดับเพื่อ + − × ÷ ^ รวมตัวเลขให้เหลือค่าเดียวเท่ากับเป้าหมาย (ทุกด่านมีคำตอบแน่นอน)</p>
<div class="target"><div id="targetBox">= 24</div></div>
<div class="tiles" id="tiles"></div>
<div class="grp"><div class="lbl">ตัวเลขเดียว (เลือก 1 ตัว)</div><div class="row">
<button class="op" id="opSqrt">√ ถอดราก</button><button class="op" id="opFact">n! แฟคทอเรียล</button></div></div>
<div class="grp"><div class="lbl">สองตัวเลข (เลือกตามลำดับ)</div><div class="row">
<button class="op" id="opAdd">+</button><button class="op" id="opSub">−</button><button class="op" id="opMul">×</button><button class="op" id="opDiv">÷</button><button class="op" id="opPow">^ ยกกำลัง</button></div></div>
<div class="msg" id="msg"></div>
<div class="history" id="history"></div>
<div class="actions">
<button class="btn" id="btnUndo">↺ ย้อนกลับ</button>
<button class="btn btn-check" id="btnCheck">✓ ตรวจคำตอบ</button>
<button class="btn" id="btnNew">🔀 สุ่มชุดใหม่</button></div>
</div></div>
<script>
const EPS=1e-6;
let TARGET=24,stage=1,tiles=[],selected=[],history=[],undoStack=[],nextId=1;
const $=id=>document.getElementById(id);
const randInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function fmt(v){return Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):String(Math.round(v*10000)/10000)}

// สร้างโจทย์ที่แก้ได้แน่นอน: สุ่มเลข 4 ตัว แล้วรวมด้วย + − × ÷ จนได้เป้าหมาย
function generate(){
  for(let n=0;n<500;n++){
    const nums=Array.from({length:4},()=>randInt(1,9));
    let pool=nums.slice();
    while(pool.length>1){
      const i=randInt(0,pool.length-1);let a=pool.splice(i,1)[0];
      const j=randInt(0,pool.length-1);let b=pool.splice(j,1)[0];
      const k=randInt(0,3);
      pool.push(k===0?a+b:k===1?a-b:k===2?a*b:(b!==0?a/b:NaN));
    }
    const t=pool[0];
    if(Number.isInteger(t)&&t>=15&&t<=90)return{nums,t};
  }
  return{nums:[3,4,6,8],t:24};
}

function newPuzzle(){
  const p=generate();TARGET=p.t;
  $('targetBox').textContent='= '+TARGET;
  tiles=p.nums.map(v=>({id:nextId++,value:v,label:String(v)}));
  selected=[];history=[];undoStack=[];
  setMsg('','');renderHistory();render();
}
function setMsg(t,c){const m=$('msg');m.textContent=t;m.className='msg'+(c?' '+c:'')}
function renderHistory(){const h=$('history');h.innerHTML=history.map(t=>`<div>${t}</div>`).join('');h.scrollTop=h.scrollHeight}
function snapshot(){undoStack.push({tiles:JSON.parse(JSON.stringify(tiles)),len:history.length})}
function undo(){
  if(!undoStack.length)return;
  const s=undoStack.pop();tiles=s.tiles;history=history.slice(0,s.len);selected=[];
  setMsg('','');renderHistory();render();
}
function toggleSelect(id){
  const i=selected.indexOf(id);
  if(i>=0)selected.splice(i,1);else{if(selected.length>=2)selected.shift();selected.push(id)}
  setMsg('','');render();
}
const getTile=id=>tiles.find(t=>t.id===id);

function applyUnary(kind){
  if(selected.length!==1){setMsg('เลือกตัวเลข 1 ตัวก่อนนะ','err');return}
  const t=getTile(selected[0]);let r,label;
  if(kind==='sqrt'){
    if(t.value<0){setMsg('ถอดรากของค่าติดลบไม่ได้','err');return}
    r=Math.sqrt(t.value);label='√'+t.label;
  }else{
    if(t.value<0||Math.abs(t.value-Math.round(t.value))>1e-9||t.value>10){setMsg('แฟคทอเรียลใช้ได้กับจำนวนเต็ม 0-10 เท่านั้น','err');return}
    r=1;for(let i=2;i<=Math.round(t.value);i++)r*=i;label=t.label+'!';
  }
  snapshot();
  history.push(`${label} = ${fmt(r)}`);
  t.value=r;t.label=label;selected=[];
  renderHistory();render();
}
function applyBinary(kind){
  if(selected.length!==2){setMsg('เลือกตัวเลข 2 ตัวตามลำดับก่อนนะ','err');return}
  const a=getTile(selected[0]),b=getTile(selected[1]);let r,s;
  if(kind==='add'){r=a.value+b.value;s='+'}
  else if(kind==='sub'){r=a.value-b.value;s='−'}
  else if(kind==='mul'){r=a.value*b.value;s='×'}
  else if(kind==='div'){
    if(Math.abs(b.value)<1e-9){setMsg('หารด้วย 0 ไม่ได้','err');return}
    r=a.value/b.value;s='÷';
  }else{
    if(Math.abs(b.value)>6||a.value>50){setMsg('เลขยกกำลังใหญ่เกินไป','err');return}
    r=Math.pow(a.value,b.value);s='^';
  }
  if(!isFinite(r)||Math.abs(r)>1e9){setMsg('ผลลัพธ์ไม่ถูกต้องหรือมากเกินไป','err');return}
  snapshot();
  history.push(`${a.label} ${s} ${b.label} = ${fmt(r)}`);
  tiles=tiles.filter(t=>t.id!==a.id&&t.id!==b.id);
  tiles.push({id:nextId++,value:r,label:`(${a.label}${s}${b.label})`});
  selected=[];renderHistory();render();
}
function checkAnswer(){
  if(tiles.length!==1){setMsg('รวมตัวเลขให้เหลือค่าเดียวก่อนนะ','err');return}
  const v=tiles[0].value;
  if(Math.abs(v-TARGET)<EPS){
    setMsg(`🎉 ถูกต้อง! ${tiles[0].label} = ${TARGET}`,'win');
    stage++;$('stagePill').textContent='ด่านที่ '+stage;
    setTimeout(newPuzzle,1400);
  }else setMsg(`ยังไม่ใช่ ${TARGET} นะ (ได้ ${fmt(v)}) ลองย้อนกลับแล้วหาวิธีอื่น`,'err');
}
function render(){
  const el=$('tiles');el.innerHTML='';
  tiles.forEach(t=>{
    const b=document.createElement('button');const i=selected.indexOf(t.id);
    b.className='tile'+(i>=0?' sel':'');
    b.innerHTML=fmt(t.value)+(i>=0?`<span class="o">${i+1}</span>`:'');
    b.onclick=()=>toggleSelect(t.id);el.appendChild(b);
  });
  const one=selected.length===1,two=selected.length===2;
  $('opSqrt').disabled=!one;$('opFact').disabled=!one;
  ['opAdd','opSub','opMul','opDiv','opPow'].forEach(id=>$(id).disabled=!two);
  $('btnCheck').disabled=tiles.length!==1;
  $('btnUndo').disabled=!undoStack.length;
}
$('opSqrt').onclick=()=>applyUnary('sqrt');
$('opFact').onclick=()=>applyUnary('fact');
$('opAdd').onclick=()=>applyBinary('add');
$('opSub').onclick=()=>applyBinary('sub');
$('opMul').onclick=()=>applyBinary('mul');
$('opDiv').onclick=()=>applyBinary('div');
$('opPow').onclick=()=>applyBinary('pow');
$('btnCheck').onclick=checkAnswer;
$('btnUndo').onclick=undo;
$('btnNew').onclick=newPuzzle;
newPuzzle();
</script>
</body>
</html>
